<!DOCTYPE html>
<html lang="en" class="<!--GLOWMARK:THEME-->">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glowmark web editor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<script>
  (function () {
    try {
      var pref = localStorage.getItem("glowmark-theme");
      if (pref) document.documentElement.className = "theme-" + pref;
    } catch (e) {}
  })();
</script>
<style>
/*GLOWMARK:STYLE*/

/* editor shell -------------------------------------------------------- */
html, body { height: 100%; }
body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 15px;
}
.web-bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 0.7rem;
  padding: 0.55rem 0.9rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg-soft);
}
.web-brand {
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--heading);
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.98rem;
}
.web-brand span { font-size: 0.85rem; color: var(--text-soft); font-weight: 500; }
.web-bar .spacer { flex: 1; }
.wbtn {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 0.78rem;
  font-family: var(--font-body);
  border-radius: 8px;
  padding: 0.35rem 0.7rem;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(0.34, 1.5, 0.5, 1), border-color 0.2s, color 0.2s;
}
.wbtn:hover { transform: translateY(-1px) scale(1.04); border-color: var(--accent); color: var(--accent); }
.wbtn:active { transform: scale(0.94); }
.wbtn.done { color: #16a34a; border-color: #16a34a; }

.panes {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 0;
}
.pane { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.pane + .pane { border-left: 1px solid var(--border); }
.pane-head {
  flex: 0 0 auto;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-soft);
  padding: 0.45rem 1rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg-soft);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#editor {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  padding: 1.1rem 1.2rem;
  font-family: var(--font-mono);
  font-size: 0.86rem;
  line-height: 1.7;
  background: var(--bg);
  color: var(--text);
  tab-size: 2;
}
#preview {
  flex: 1;
  overflow-y: auto;
  padding: 1.6rem 1.8rem 3rem;
}
.preview-empty {
  color: var(--text-soft);
  font-style: italic;
}
.web-status {
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  font-size: 0.74rem;
  color: var(--text-soft);
  padding: 0.4rem 0.9rem;
  border-top: 1px solid var(--border);
  background: var(--bg-soft);
}
.live-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #22c55e;
  margin-right: 0.35rem;
  animation: wdots 2s infinite;
}
@keyframes wdots { 70% { opacity: 0.35; } 100% { opacity: 1; } }
.web-tabs { display: none; gap: 0.4rem; }

@media (max-width: 820px) {
  .panes { grid-template-columns: 1fr; }
  .pane + .pane { border-left: none; }
  .pane { display: none; }
  .pane.active { display: flex; }
  .web-tabs { display: flex; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header class="web-bar">
  <div class="web-brand">✨ glowmark <span>web editor</span></div>
  <div class="web-tabs">
    <button class="wbtn" id="tabEdit" type="button">Edit</button>
    <button class="wbtn" id="tabView" type="button">Preview</button>
  </div>
  <div class="spacer"></div>
  <button class="wbtn" id="copyHtml" type="button">copy HTML</button>
  <button class="wbtn" id="downloadHtml" type="button">download</button>
  <button class="wbtn" id="webTheme" type="button" aria-label="Toggle theme">🌙</button>
</header>

<main class="panes">
  <section class="pane active" id="editPane">
    <div class="pane-head">markdown</div>
    <textarea id="editor" spellcheck="false" placeholder="# Start typing markdown…"></textarea>
  </section>
  <section class="pane" id="viewPane">
    <div class="pane-head"><span>preview</span><span id="headTitle"></span></div>
    <article class="content" id="preview"></article>
  </section>
</main>

<footer class="web-status">
  <span id="stats">ready</span>
  <span><span class="live-dot"></span>live — updates as you type</span>
</footer>

<script>
//GLOWMARK:JS
</script>
</body>
</html>
