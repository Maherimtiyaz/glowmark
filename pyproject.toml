[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glowmark"
version = "1.0.0"
description = "Turn Markdown into a beautiful, standalone HTML page."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Pinned so golden snapshots and the generated landing pages stay byte-identical
# across CI runs. Bump deliberately, then regenerate with scripts/build_site.py.
dependencies = [
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
    "pygments==2.21.0",
]
[project.optional-dependencies]
watch = ["watchdog>=3.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
glowmark = "glowmark.cli:main"

[tool.setuptools]
packages = ["glowmark"]

[tool.setuptools.package-data]
glowmark = ["templates/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
