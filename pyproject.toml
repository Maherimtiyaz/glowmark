[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glowmark"
version = "1.0.0"
description = "Turn Markdown into a beautiful, standalone HTML page."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "markdown>=3.5",
    "pygments>=2.17",
]
[project.optional-dependencies]
watch = ["watchdog>=3.0"]

[project.scripts]
glowmark = "glowmark.cli:main"

[tool.setuptools]
packages = ["glowmark"]

[tool.setuptools.package-data]
glowmark = ["templates/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
